<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
  <body>
    <div id="container">
      <div id="title">Todo List</div>

      <div style="display: flex; align-items: center; justify-content: center; height: 90%;">
        <div id="left">
          <form>
            <div class="md-3">
                <h3 style="color: grey;">Add Task</h3>
            </div>
            <div class="mb-3 w-75">
                <label for="taskTitle" class="form-label"> Title</label>
                <input type="text" class="form-control" id="taskTitle">
            </div>
            <div class="mb-3 w-75">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" class="form-control"></textarea>
            </div>
            <div class="mb-3 w-75">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" class="form-control"></input>
            </div>
            <div class="mb-3 w-75">
                <label for="time" class="form-label">Time</label>
                <input type="time" id="time" class="form-control"></input>
            </div>
            
            <div style="display: flex;">
                <button type="submit" class="btn btn-primary" style="margin-right: 4px;">Add</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
            </form>
        </div>

        <div id="right">
            <!-- The tasks will be added here... -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
